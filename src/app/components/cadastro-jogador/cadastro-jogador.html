<div class="component-container">
  <div class="page-header">
    <h2>Gestão de Atletas</h2>
    <p class="page-desc">Cadastro de jogadores e controle financeiro da liga.</p>
  </div>

  <div class="card-box">
    <span class="section-title">Cadastrar Novo Atleta</span>
    
    <div class="form-row">
      <div class="input-group">
        <label>Nome do Atleta</label>
        <input type="text" [(ngModel)]="novoNome" placeholder="Ex: Gabriel Jesus">
      </div>

      <div class="input-group">
        <label>Posição</label>
        <select [(ngModel)]="novaPosicao">
          <option value="GOL">Goleiro (GOL)</option>
          <option value="ZAG">Zagueiro (ZAG)</option>
          <option value="LAT">Lateral (LAT)</option>
          <option value="MEI">Meia (MEI)</option>
          <option value="ATA">Atacante (ATA)</option>
        </select>
      </div>

      <button type="button" class="btn-primary" (click)="adicionarAtleta()">
        Cadastrar Atleta
      </button>
    </div>
  </div>

  <div class="table-container mt-4">
    <table class="data-table">
      <thead>
        <tr>
          <th>Nome do Atleta</th>
          <th>Posição</th>
          <th class="text-center">Mensalidade</th>
          <th class="text-right">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let player of cartolaService.players">
          <td class="player-name">{{ player.nome }}</td>
          <td><span class="pos-badge">{{ player.posicao }}</span></td>
          <td class="text-center">
            <button 
              type="button"
              class="status-badge" 
              [class.paid]="player.mensalidadePaga"
              (click)="togglePagamento(player)">
              {{ player.mensalidadePaga ? 'Pago' : 'Pendente' }}
            </button>
          </td>
          <td class="text-right">
            <button type="button" class="btn-danger-text" (click)="removerAtleta(player.id)">
              Remover
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
