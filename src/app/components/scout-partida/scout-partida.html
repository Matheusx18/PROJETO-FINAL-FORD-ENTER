<div class="component-container">
  <div class="page-header">
    <h2>Scout & Registro de Estatísticas</h2>
    <p class="page-desc">Selecione um atleta para registrar os dados da partida e atualizar a nota (Máx: 10.0).</p>
  </div>

  <div class="scout-grid">
    <div class="card-box players-list">
      <span class="section-title">Selecionar Atleta</span>
      <div class="player-cards-container">
        <div 
          *ngFor="let player of cartolaService.players"
          class="player-select-card"
          [class.selected]="selectedPlayer?.id === player.id"
          (click)="selectPlayer(player)">
          <div class="player-details">
            <span class="player-name">{{ player.nome }}</span>
            <span class="pos-badge">{{ player.posicao }}</span>
          </div>
          <span class="score-pill">{{ player.nota }}</span>
        </div>
      </div>
    </div>

    <div class="card-box scout-panel" *ngIf="selectedPlayer">
      <div class="scout-header">
        <h3>Atualizar Scout: <span class="text-accent">{{ selectedPlayer.nome }}</span></h3>
      </div>
      
      <div class="scout-stats-grid">
        <div class="input-group">
          <label>Gols Marcados</label>
          <input type="number" min="0" [(ngModel)]="scoutEdit.gols">
        </div>
        <div class="input-group">
          <label>Assistências</label>
          <input type="number" min="0" [(ngModel)]="scoutEdit.assistencias">
        </div>
        <div class="input-group">
          <label>Cartões Amarelos</label>
          <input type="number" min="0" [(ngModel)]="scoutEdit.cartoesAmarelos">
        </div>
        <div class="input-group">
          <label>Cartões Vermelhos</label>
          <input type="number" min="0" [(ngModel)]="scoutEdit.cartoesVermelhos">
        </div>
      </div>

      <button type="button" class="btn-primary mt-4" (click)="salvarScout()">
        Salvar Estatísticas e Recalcular Nota
      </button>
    </div>
    
    <div class="card-box empty-state" *ngIf="!selectedPlayer">
      <p class="text-muted">Selecione um atleta na lista ao lado para editar o scout.</p>
    </div>
  </div>
</div>
