<div class="component-container">
  <div class="page-header">
    <h2>Sorteio Equilibrado de Times</h2>
    <p class="page-desc">Selecione os atletas presentes. O sistema dividirá os times equilibrando a média das notas.</p>
  </div>

  <div class="card-box">
    <div class="sorteio-controls">
      <div class="input-group">
        <label>Quantidade de Times</label>
        <select [(ngModel)]="numTimes">
          <option [value]="2">2 Times (Time A vs Time B)</option>
          <option [value]="3">3 Times (Time A vs B vs C)</option>
          <option [value]="4">4 Times (Time A vs B vs C vs D)</option>
        </select>
      </div>

      <button type="button" class="btn-primary" (click)="sortearEquipas()">
        Sortear Times
      </button>
    </div>

    <div class="presence-section mt-4">
      <span class="section-title">Confirmar Presença na Pelada</span>
      <div class="presence-grid">
        <label 
          *ngFor="let player of cartolaService.players" 
          class="checkbox-card"
          [class.checked]="player.presente">
          <input type="checkbox" [(ngModel)]="player.presente">
          <div class="checkbox-info">
            <span class="player-name">{{ player.nome }}</span>
            <span class="player-meta">{{ player.posicao }} • Nota: {{ player.nota }}</span>
          </div>
        </label>
      </div>
    </div>
  </div>

  <div class="teams-result-grid mt-4" *ngIf="timesSorteados.length > 0">
    <div class="card-box team-card" *ngFor="let time of timesSorteados; let i = index">
      <div class="team-header">
        <h3>Time {{ i + 1 }}</h3>
        <span class="team-avg">Média: {{ getMediaTime(time) }}</span>
      </div>
      <table class="data-table">
        <tbody>
          <tr *ngFor="let p of time">
            <td class="player-name">{{ p.nome }}</td>
            <td class="text-right"><span class="pos-badge">{{ p.posicao }}</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
